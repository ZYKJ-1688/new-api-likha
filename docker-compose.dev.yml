# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. make dev-web
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin. This does not configure relay CORS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
      # - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}  # 阿里云 RAM 子账号 AK，文件上传功能必填 (Aliyun RAM AccessKeyId, required for file upload)
      # - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}  # 阿里云 SK，与 AK 成对；建议放 .env 而非提交进仓库 (Aliyun RAM AccessKeySecret; prefer .env over committing to the repo)
      # - OSS_BUCKET=dev-img-likha  # OSS 桶名 (OSS bucket name)
      # - OSS_REGION=ap-southeast-5  # 桶所在地域 (bucket region, e.g. cn-hangzhou)
      # - OSS_PUBLIC_BASE_URL=  # 可选，自定义域名/CDN 前缀，影响上传返回的 URL (optional custom domain/CDN prefix for returned URLs)
      # - OSS_MAX_FILE_SIZE=20971520  # 可选，单文件上限字节，默认 20MB (optional per-file limit in bytes, default 20 MiB)
      # - OSS_ALLOWED_EXTENSIONS=png,jpg,jpeg,gif,webp  # 可选，扩展名白名单，逗号分隔 (optional comma-separated extension whitelist)
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
