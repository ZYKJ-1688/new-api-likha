name: pre-build

# 雅加达 pre（预发布）环境发布流水线（GitOps）
#
# 链路：切 release/*（create 事件）或 push release/* 或 main（PR 合并到 main 后的 push 自动触发）
#      或打 tag（create 事件，镜像 tag = pre-<tag名>，如 pre-v1.0.2）
#      → 构建镜像 → 推马尼拉 ACR(newapi-pre) → 回写 ops 仓（写不可变 tag）→ ArgoCD 收敛
# 真源：new-api-likha-ops/overlays/jkt-pre/kustomization.yaml
#
# 与 dev-build.yml 的差异只有**环境参数**（ACR_NAMESPACE / OPS_ENV / SMOKE_URL / tag 前缀）
# 和**触发范围**（dev 听 development push；pre 听 release/* 的创建与 push、main 的 push、以及 tag 创建）。
# 刻意保持同构：预发要验证的正是「同一条发布链路」，链路不同就失去了预发的意义。
#
# 四条红线（同 dev；第 1 条按 pre 的 tag 发布需求调整）：
#   1. 不用 push:tags 直接触发（本仓 release.yml 监听 tags:'*'，打 tag 会同时启动三平台二进制构建）；
#      tag 触发改走 create 事件，镜像 tag 固定为 pre-<tag名>，与 prod 的 vX.Y.Z 前缀对齐
#   2. 绝不把 kubeconfig 放进 CI（CI 不认识集群，只改 Git）
#   3. ops 回写失败必须让 job 红（否则「镜像推了但没部署」是最难查的静默失败）
#   4. 镜像用「不可变 tag」引用（不是 digest，也不是 latest）：ACR 仓库已开 Immutable

on:
  push:
    # main 受保护，push 只能来自 merge queue 的 PR 合并 —— 即「PR 合并成功后自动发布 pre」；
    # 纯文档/deploy/docs 改动的合并由 paths-ignore 跳过，不空耗构建。
    branches:
      - 'release/*'
      - 'main'
    paths-ignore:
      - '**/*.md'
      - 'deploy/**'
      - 'docs/**'
  # ⚠️ 为什么还要单独挂 create：
  #    切分支**不产生任何文件变更**，而 paths-ignore 要求「至少一个非忽略文件被改动」才跑，
  #    于是「从 development 建 release/x.y.z」这个动作会被 push 过滤器整个吞掉
  #    （2026-11-04 实测：直接建 release/0.0.0-probe，pre-build 零 run）。
  #    而 10.2 流程的 D-1 步正是「切 release 分支 → CI 出 rc 镜像 → 上 pre」，
  #    所以用 create 事件兜住「分支刚创建」这一动作 —— create 不受 paths 过滤影响。
  #    代价：create 对 tag 也会触发，job 级 if 分流处理：分支只放行 release/* 与 main，
  #    tag 全部放行 —— 对 main 打版本 tag 时同步发 pre，镜像 tag 为 pre-<tag名>（如 pre-v1.0.2）。
  #    ⚠️ create 事件只认**默认分支（main）**上的 workflow 定义，改完必须同步到 main 才生效。
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # main / release/* / tag 部署的是同一个 jkt-pre：统一分组串行化，
  # 避免两个 ref 同时回写 ops 仓互相覆盖；新构建取消在途构建（最新内容优先）。
  group: pre-build
  # ⚠️ 不能无条件 cancel-in-progress: true。create 事件对**任意**分支都会触发一次 run，
  #    而「是否放行」是 build-push 的 job 级 if 决定的 —— run 本身已经进了并发组，
  #    于是「随便建一个无关分支」就会把正在跑的 rc/pre 构建取消掉。
  #    2026-11-04 实测：建 fix/pre-build-tag-trigger 把 release/0.0.0-ci-probe 的构建
  #    从 in_progress 打成 cancelled（该 run 自己的作业全是 skipped）。
  #    所以只在「这次运行确实会构建」时才允许取消，谓词必须与 build-push 的 if 保持一致。
  cancel-in-progress: ${{ github.event_name != 'create' || github.ref_type == 'tag' || (github.ref_type == 'branch' && (startsWith(github.ref_name, 'release/') || github.ref_name == 'main')) }}

env:
  ACR_NAMESPACE: newapi-pre
  ACR_REPO: newapi-master
  OPS_REPO: ZYKJ-1688/new-api-likha-ops
  OPS_ENV: jkt-pre
  SMOKE_URL: https://pre.likha.hk/api/status

jobs:
  build-push:
    name: Build & push image
    # create 事件对分支和 tag 都会触发：分支只放行 release/* 与 main 的创建；
    # tag 全部放行 —— 对 main 打版本 tag 时同步发 pre 环境（镜像 tag 仍为
    # pre-时间戳-sha7，与 prod 的 vX.Y.Z 互不冲突，靠 sha 可互相对账）。
    # 其余事件（push / workflow_dispatch）照旧放行。
    if: github.event_name != 'create' || github.ref_type == 'tag' || (github.ref_type == 'branch' && (startsWith(github.ref_name, 'release/') || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Compute tag
        id: meta
        # 镜像 tag 两类格式，统一 pre- 前缀并内嵌来源：
        #   打 tag（create tag 事件）→ pre-<tag名>（如 pre-v1.0.2），与 prod 的 vX.Y.Z 前缀对齐；
        #   分支 push（release/*、main）→ pre-<分支名>-YYYYMMDD-HHMMSS-<sha7>：
        #     main → pre-main-…；release/v1.0.0-rc.1 → pre-v1.0.0-rc.1-…（去掉 release/ 前缀）。
        #   ★ 精确到秒的理由同 dev-build：ACR tag 不可变，分支可反复推，秒级粒度才不撞名。
        #   ★ 时区显式钉 Asia/Shanghai，保证与 dev 的 tag 在同一时间轴上可比较。
        #   ★ Docker tag 不允许「/」，分支名需去 release/ 前缀并替换非法字符。
        # ⚠️ pre-<tag名> 受 ACR「不可变」约束：同一版本号只能推送一次，
        #    重跑/重推同一 tag 会直接失败 —— 这是「tag 即版本」语义的代价。
        run: |
          if [ "$GITHUB_EVENT_NAME" = "create" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="pre-${GITHUB_REF_NAME}"
          else
            BRANCH="${GITHUB_REF_NAME#release/}"
            BRANCH="${BRANCH//\//-}"
            TAG="pre-${BRANCH}-$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          fi
          IMAGE="${{ secrets.ACR_REGISTRY }}/${ACR_NAMESPACE}/${ACR_REPO}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG"     >> "$GITHUB_ENV"
          echo "### 本次构建（pre）" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- repo: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp VERSION（镜像内版本号，供 /api/status 反查）
        # 上游 Dockerfile 从 ./VERSION 读版本（COPY ./VERSION /build/VERSION + go build -ldflags）。
        # 不注入就永远查不到线上跑的是哪个 commit。
        run: echo "$TAG" > VERSION

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # ★ 关掉 buildx 默认的 provenance / sbom attestation。
          # 不关的话 tag 会变成 OCI image index，顶层 index digest 与 amd64 manifest digest
          # 对不上，排查极度费时（2026-10-27 dev 踩过）。需要供应链证明时再开。
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # 与 dev 分开的 cache scope，避免两个环境互相污染构建缓存
          cache-from: type=gha,scope=prebuild
          cache-to: type=gha,mode=max,scope=prebuild

      - name: Trivy scan (report only)
        # ⚠️ 暂不阻断：基础镜像的历史漏洞还没清完，现在改 exit-code 1 会让 pre 常年红。
        #    清理完成后按「预发/正式一视同仁」的要求，把 pre 与 prod 一起改成 exit-code 1。
        # ⚠️ tag 必须带 `v` 前缀且 pin 到 commit SHA：写 `@0.28.0`（无 v）会让整个 job
        #    在 "Set up job" 阶段就 `Unable to resolve action` 失败（2026-10-27 实测）。
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL
          exit-code: "0"

      - name: Summary
        run: |
          echo "- digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 推送完成，下一步回写 ops 仓（jkt-pre）" >> "$GITHUB_STEP_SUMMARY"

  bump-ops:
    name: Bump ops repo (jkt-pre)
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone ops repo
        env:
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${OPS_REPO_TOKEN}@github.com/${OPS_REPO}.git" ops

      - name: Set image tag
        working-directory: ops
        env:
          # ⚠️ 不要用 needs.build-push.outputs.image：实测传过来是空串，
          #    导致 newName 被写空、镜像退化成 docker.io/library/<name>@sha256:…
          #    然后 ImagePullBackOff。这里直接重拼，只依赖 secrets + job env。
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          TAG: ${{ needs.build-push.outputs.tag }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          case "$IMAGE" in
            *aliyuncs.com/*) : ;;
            *) echo "::error::ACR_REGISTRY 拼接异常，拒绝写入: '$IMAGE'"; exit 1 ;;
          esac
          echo "target image = ${IMAGE}:${TAG}"
          echo "  digest=${DIGEST}（仅记录，不写入清单）"
          # 写不可变 tag。ACR 仓库已开「不可变」：同名 tag 不可覆盖、不可删除 ⇒
          # tag 等价于稳定引用，回滚语义与 digest 一致，而可读性远好于 64 位 digest。
          # ★ 前提：ACR 的「不可变」必须保持开启。
          bash scripts/set-image.sh "$OPS_ENV" "${IMAGE}:${TAG}"
          git diff --stat

      - name: Commit & push
        working-directory: ops
        env:
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
          TAG: ${{ needs.build-push.outputs.tag }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          git config user.name  "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "manifest 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(${OPS_ENV}): ${TAG} (src=${GITHUB_SHA:0:7})"
          # 禁止 force push：被并发发布抢先就 rebase 后重推
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

  smoke:
    name: Smoke (non-blocking)
    needs: [build-push, bump-ops]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Wait for ArgoCD rollout then check version
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          for i in $(seq 1 14); do
            code=$(curl -s -o /tmp/status.json -w '%{http_code}' -m 10 "$SMOKE_URL" || true)
            if [ "$code" = "200" ]; then
              if grep -q "$TAG" /tmp/status.json; then
                echo "✓ 已看到新版本 $TAG"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::warning::4.5 分钟内未在 /api/status 看到 $TAG（ArgoCD 轮询 3min + 滚动 30s，可再等等）"
